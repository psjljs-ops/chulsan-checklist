<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{OFFERS_TITLE}} | {{SITE_TITLE}}</title>
<meta name="theme-color" content="#d85a30">
<!--SEO-->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --bg: #fff6f1; --card: #ffffff; --text: #2b1d18; --sub: #6b5750; --muted: #a08f88;
    --line: #f3e4dc; --soft: #fdf0ea;
    --blue: #d85a30; --blue-press: #b8471f; --blue-soft: #fde6dc; --blue-text: #993c1d;
    --green: #00b37e; --green-soft: #e5f8f1;
    --shadow: 0 2px 14px rgba(120, 50, 20, .07);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161110; --card: #211a18; --text: #f6eeea; --sub: #cdbdb6; --muted: #957f77;
      --line: #332824; --soft: #2a211e;
      --blue: #ff8a65; --blue-press: #ff7448; --blue-soft: #3b241b; --blue-text: #ffb59a;
      --green: #2fd39a; --green-soft: #12302a; --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    line-height: 1.6; letter-spacing: -0.01em; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 16px 48px; }
  .disclosure { font-size: 12px; color: var(--muted); padding: 12px 0 0; line-height: 1.5; margin: 0; }
  .back { display: inline-flex; align-items: center; gap: 4px; margin-top: 16px; color: var(--sub); font-weight: 600;
    font-size: 15px; text-decoration: none; }
  .back:hover { color: var(--text); }
  .hero { padding: 20px 4px 4px; }
  .eyebrow { display: inline-block; font-size: 13px; font-weight: 700; color: var(--blue-text);
    background: var(--blue-soft); padding: 4px 10px; border-radius: 99px; margin-bottom: 12px; }
  h1 { font-size: clamp(26px, 7vw, 34px); line-height: 1.3; margin: 0 0 10px; font-weight: 800; letter-spacing: -0.03em; }
  h1 em { font-style: normal; color: var(--blue); }
  .lead { color: var(--sub); margin: 0; font-size: 16px; }
  .card { background: var(--card); border-radius: 22px; padding: 22px; margin-top: 16px; box-shadow: var(--shadow); }
  .tip { display: flex; gap: 12px; align-items: flex-start; background: var(--blue-soft); color: var(--blue-text);
    border-radius: 16px; padding: 14px 16px; font-size: 15px; font-weight: 600; margin-top: 16px; }
  .tip svg { flex: none; margin-top: 2px; }

  /* 상담형(견적) 카드 */
  .company { display: flex; flex-direction: column; gap: 14px; }
  .company-head { display: flex; align-items: center; gap: 14px; }
  .logo { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; flex: none;
    font-weight: 800; font-size: 20px; color: #fff; overflow: hidden; }
  .logo img { width: 100%; height: 100%; object-fit: cover; }
  .name { font-size: 19px; font-weight: 800; letter-spacing: -0.03em; }
  .desc { color: var(--sub); font-size: 14px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tags span { font-size: 13px; font-weight: 600; color: var(--sub); background: var(--soft); padding: 4px 10px; border-radius: 99px; }
  .cta { display: flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; font-size: 16px;
    font-weight: 700; border-radius: 14px; padding: 15px 16px; background: var(--blue); color: #fff; transition: background .15s, transform .1s; }
  .cta:hover { background: var(--blue-press); }
  .cta:active { transform: scale(.98); }
  .cta.visited { background: var(--green-soft); color: var(--green); }
  .cta.visited::before { content: "✓"; }

  /* 쇼핑형(제품) 카드 — 일러스트용 작은 목록 */
  .grid { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
  .product { background: var(--card); border-radius: 18px; box-shadow: var(--shadow); padding: 12px 14px;
    display: flex; align-items: center; gap: 14px; text-decoration: none; color: inherit; transition: background .15s; }
  .product:hover { background: var(--soft); }
  .thumb { width: 56px; height: 56px; flex: none; border-radius: 14px; background: var(--blue-soft);
    display: grid; place-items: center; overflow: hidden; }
  .thumb img { width: 80%; height: 80%; object-fit: contain; }
  .thumb span { font-size: 28px; line-height: 1; }
  .pbody { flex: 1; min-width: 0; }
  .pname { font-size: 16px; font-weight: 700; line-height: 1.4; }
  .pdesc { font-size: 13px; color: var(--sub); }
  .pbtn { flex: none; font-size: 13px; font-weight: 700; color: var(--blue-text); background: var(--blue-soft);
    padding: 8px 12px; border-radius: 10px; white-space: nowrap; }

  h2 { font-size: 19px; font-weight: 800; margin: 0 0 14px; letter-spacing: -0.03em; }
  .points { list-style: none; padding: 0; margin: 0; counter-reset: p; }
  .points li { counter-increment: p; display: flex; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
  .points li:first-child { border-top: 0; padding-top: 0; }
  .points li::before { content: counter(p); flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--blue-soft);
    color: var(--blue-text); font-weight: 800; font-size: 14px; display: grid; place-items: center; }
  .points b { display: block; }
  .points span { color: var(--sub); font-size: 14px; }
  .more { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .more a { background: var(--soft); border-radius: 14px; padding: 14px; text-decoration: none; color: var(--text);
    font-weight: 700; font-size: 15px; display: flex; gap: 8px; align-items: center; }
  .more a:hover { background: var(--line); }
  .empty { text-align: center; color: var(--muted); padding: 36px 16px; }
  footer { color: var(--muted); font-size: 12px; text-align: center; margin-top: 28px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

function leadCard(it) {

  return '<a class="product" href="' + esc(it.url || "#") + '" target="_blank" rel="sponsored nofollow noopener" data-name="' + esc(it.name) + '">' +
    '<div class="thumb">' + thumb + '</div><div class="pbody">' +
    '<div class="pname">' + esc(it.name) + '</div>' + (it.desc ? '<div class="pdesc">' + esc(it.desc) + '</div>' : "") +
    '</div><span class="pbtn">' + esc(st.btn || "보러 가기") + '</span></a>';
}

function renderIndex() {
  document.title = "{{OFFERS_TITLE}} | {{SITE_TITLE}}";
  document.getElementById("disclosure").textContent = DISCLOSURE.ajungdang + " " + DISCLOSURE.coupang;
  var h = '<header class="hero"><span class="eyebrow">추천 모음</span><h1>{{OFFERS_TITLE}}</h1>' +
    '<p class="lead">필요한 항목을 골라 보세요.</p></header>';
  key = null;
  h += moreLinks().replace("다른 추천도 확인해 보세요", "무엇이 필요하세요?");
  document.getElementById("page").innerHTML = h;
}

function renderCategory() {
  var items = cat.items.filter(function (it) { return it.url || SHOW_EMPTY_LINKS; });
  var leads = items.filter(function (it) { return (STORES[it.store] || {}).lead; });
  var shops = items.filter(function (it) { return !(STORES[it.store] || {}).lead; });
  if (cat.max) leads = leads.slice(0, cat.max);

  /* 이 페이지에 실제로 나오는 제휴 종류에 맞춰 대가성 문구 구성 */
  var d = [];
  if (leads.some(function (it) { return it.store === "ajungdang"; })) d.push(DISCLOSURE.ajungdang);
  if (leads.some(function (it) { return it.store !== "ajungdang"; })) d.push(DISCLOSURE.lead);
  if (shops.some(function (it) { return it.store === "coupang"; })) d.push(DISCLOSURE.coupang);
  document.getElementById("disclosure").textContent = d.join(" ");

  var badge = cat.badge;
  if (date && leads.length) {
    var a = date.split("-"), dt = new Date(+a[0], +a[1]-1, +a[2]);
    badge = (dt.getMonth()+1) + "월 " + dt.getDate() + "일 (" + WD[dt.getDay()] + ") · " + cat.badge;
  }
  document.title = cat.menu + " | {{SITE_TITLE}}";

  var h = '<header class="hero"><span class="eyebrow">' + esc(badge) + '</span><h1>' + cat.title + '</h1><p class="lead">' + esc(cat.lead) + '</p></header>';
  if (cat.tip) h += '<div class="tip">' + infoIcon + '<div>' + esc(cat.tip) + '</div></div>';
  h += leads.map(leadCard).join("");
  if (shops.length) h += '<div class="grid">' + shops.map(productCard).join("") + '</div>';
  if (!leads.length && !shops.length) h += '<div class="card empty">지금은 준비 중이에요.</div>';
  if (cat.points) {
    h += '<section class="card"><h2>꼭 확인하세요</h2><ol class="points">' +
      cat.points.map(function (p) { return '<li><div><b>' + esc(p[0]) + '</b><span>' + esc(p[1]) + '</span></div></li>'; }).join("") + '</ol></section>';
  }
  h += moreLinks();
  document.getElementById("page").innerHTML = h;
}

if (cat) renderCategory(); else renderIndex();

document.getElementById("page").addEventListener("click", function (e) {
  var a = e.target.closest("a.cta, a.product"); if (!a) return;
  if (a.getAttribute("href") === "#") { e.preventDefault(); alert("제휴 링크가 아직 설정되지 않았어요 (" + a.dataset.name + ")"); return; }
  if (a.classList.contains("cta")) {
    visited[a.dataset.name] = true;
    try { localStorage.setItem(VKEY, JSON.stringify(visited)); } catch (err) {}
    a.classList.add("visited"); a.textContent = "신청 페이지 다시 열기";
  }
});
</script>
</body>
</html>
